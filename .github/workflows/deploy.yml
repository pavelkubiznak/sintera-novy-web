name: Build & publish (Google Sheet → Pages)

# Přegeneruje web z Google Sheetu a commitne výstup zpět do main.
# GitHub Pages (legacy, zdroj = větev main) pak automaticky publikuje.
on:
  push:
    branches: [main]          # ruční změny (šablona, kód) → rebuild ze Sheetu
  schedule:
    - cron: "0 4 * * *"       # denně 04:00 UTC (~06:00 Praha) → promítne změny v Sheetu
  workflow_dispatch:           # ruční spuštění z GitHubu

permissions:
  contents: write              # GITHUB_TOKEN smí commitnout výstup

concurrency:
  group: sheet-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50      # IndexNow porovnává s revizí před pushem

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Build ze Sheetu
        run: node build/build.mjs

      - name: Commit & push, jen když se výstup změnil
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Beze změn — Sheet i výstup se shodují, nic se necommituje."
          else
            git commit -m "chore: rebuild webu ze Sheetu [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Výstup aktualizován a publikován přes GitHub Pages."
          fi

      # Ohlásí změněné stránky Bingu/Seznamu (Bing = zdroj vyhledávání ChatGPT). Nikdy neshodí deploy.
      - name: Ohlásit změny vyhledávačům (IndexNow)
        if: github.event_name == 'push' || steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          sleep 60   # ať GitHub Pages stihne publikovat, než si Bing stránky stáhne
          SINCE="HEAD~1"
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then SINCE="$BEFORE"; fi
          node build/indexnow.mjs "$SINCE"
